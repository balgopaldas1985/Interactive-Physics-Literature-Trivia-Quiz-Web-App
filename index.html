<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Arena // Physics & Literature Masterclass</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .score-val { color: #38bdf8; }
        .reward-val { color: #4ade80; }

        .question-box {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: rgba(74, 222, 128, 0.2);
            border-color: #4ade80;
            color: #4ade80;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #ef4444;
        }

        .feedback {
            text-align: center;
            font-weight: 600;
            margin-bottom: 15px;
            min-height: 24px;
        }

        .next-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>TRIVIA ARENA</h1>
        <div class="subtitle">Physics & Advanced Literature Masterclass</div>

        <div class="stats-bar">
            <div>Score: <span class="score-val" id="score">0</span></div>
            <div>Virtual Cash Pool: <span class="reward-val" id="reward">$0</span></div>
        </div>

        <div class="question-box" id="questionText">Loading question...</div>

        <div class="options-grid" id="optionsGrid">
            <!-- Options injected dynamically -->
        </div>

        <div class="feedback" id="feedback"></div>

        <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Challenge</button>
    </div>

    <script>
        const quizData = [
            {
                question: "In Physics, what is the fundamental particle that mediates the gravitational interaction according to quantum field theory hypotheses?",
                options: ["Photon", "Gluon", "Graviton", "Higgs Boson"],
                answer: 2
            },
            {
                question: "Which literary masterpiece by Oscar Wilde explores the corrupting nature of vanity and hedonism through a portrait?",
                options: ["The Happy Prince", "The Picture of Dorian Gray", "The Importance of Being Earnest", "Salomé"],
                answer: 1
            },
            {
                question: "According to Einstein's Theory of General Relativity, what happens to the flow of time inside a stronger gravitational field?",
                options: ["Time speeds up", "Time slows down", "Time stops completely", "Time remains unaffected"],
                answer: 1
            },
            {
                question: "In Rabindranath Tagore's philosophical and travel essays such as 'Japan Jatri', what core theme is prominently emphasized?",
                options: ["Industrial machinery", "Eastern spiritual unity and cultural harmony", "Naval warfare tactics", "Subatomic particle physics"],
                answer: 1
            },
            {
                question: "What does the Heisenberg Uncertainty Principle state is impossible to simultaneously measure with absolute precision?",
                options: ["Mass and Volume", "Position and Momentum", "Temperature and Pressure", "Charge and Spin"],
                answer: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let virtualCash = 0;
        let answered = false;

        const questionText = document.getElementById('questionText');
        const optionsGrid = document.getElementById('optionsGrid');
        const scoreDisplay = document.getElementById('score');
        const rewardDisplay = document.getElementById('reward');
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');

        function loadQuestion() {
            answered = false;
            feedback.innerText = "";
            nextBtn.style.display = "none";
            optionsGrid.innerHTML = "";

            const q = quizData[currentQuestionIndex];
            questionText.innerText = `Q${currentQuestionIndex + 1}: ${q.question}`;

            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsGrid.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btnElement) {
            if (answered) return;
            answered = true;

            const q = quizData[currentQuestionIndex];
            const allBtns = optionsGrid.children;

            if (selectedIndex === q.answer) {
                btnElement.classList.add('correct');
                feedback.innerText = "Correct! +10 Points & +$100 Virtual Reward";
                feedback.style.color = "#4ade80";
                score += 10;
                virtualCash += 100;
            } else {
                btnElement.classList.add('wrong');
                allBtns[q.answer].classList.add('correct');
                feedback.innerText = "Incorrect! Study harder on this topic.";
                feedback.style.color = "#ef4444";
            }

            scoreDisplay.innerText = score;
            rewardDisplay.innerText = `$${virtualCash}`;

            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.style.display = "block";
            } else {
                setTimeout(() => {
                    questionText.innerText = "🏆 Arena Completed! You mastered Physics & Literature challenges.";
                    optionsGrid.innerHTML = "";
                    feedback.innerText = `Final Score: ${score} | Total Virtual Pool: $${virtualCash}`;
                    nextBtn.innerText = "Restart Arena";
                    nextBtn.style.display = "block";
                    nextBtn.onclick = restartGame;
                }, 1500);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            virtualCash = 0;
            scoreDisplay.innerText = score;
            rewardDisplay.innerText = `$${virtualCash}`;
            nextBtn.innerText = "Next Challenge";
            nextBtn.onclick = nextQuestion;
            loadQuestion();
        }

        // Initialize Game
        loadQuestion();
    </script>
</body>
  </html>
